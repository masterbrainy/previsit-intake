[project]
name = "previsit"
version = "0.1.0"
description = "PATH: pre-visit voice AI history taking with physician-gated recommendations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "openai>=1.60",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
demo = [
    "pillow>=12.3.0",
    "playwright>=1.63.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/previsit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real OpenAI API (needs OPENAI_API_KEY)"]
addopts = "-m 'not live'"
